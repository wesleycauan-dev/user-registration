services:
  - type: web
    name: user-registration-api
    runtime: node
    plan: starter
    rootDir: Node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: MONGODB_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
